version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: angola92-api:0.2.0
    container_name: angola92-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      CORS_ORIGINS: "http://localhost:8080,http://localhost:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./eleicoes.db:/app/eleicoes.db:ro
      - ./public/data:/app/public/data:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - angola92-net

  nginx:
    image: nginx:1.27-alpine
    container_name: angola92-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - angola92-net

networks:
  angola92-net:
    driver: bridge
